name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 测试与语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python 语法检查
        run: python -m compileall -q server sim calibration

      - name: 内核自测（66 条）
        run: python sim/selftest.py

      - name: 前端资源引用检查
        run: node tools/asset_check.js

      - name: 地图几何校验（31 条）
        run: node tools/map_check.js

      - name: 目标模式校验（8 条）
        run: node tools/goal_check.js

      - name: 面板与 AI 票价校验（20 条）
        run: node tools/panel_check.js

      - name: 开线手势校验（10 条）
        run: node tools/route_gui_check.js
